[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx-slim"
version = "1.0.0"
description = "Shrink a .pptx under a target size without touching layout, text or animation"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [{ name = "Howard" }]
keywords = ["pptx", "powerpoint", "compress", "image", "office", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = ["Pillow>=9.1"]

[project.urls]
Homepage = "https://github.com/Forever61T/pptx-slim"
Issues = "https://github.com/Forever61T/pptx-slim/issues"

[project.scripts]
pptx-slim = "pptx_slim:main"

[tool.setuptools]
py-modules = ["pptx_slim"]
